name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore src\HelloLock.csproj
      - name: Build
        run: dotnet build src\HelloLock.csproj -c Release --no-restore -warnaserror
      - name: Publish framework-dependent
        run: >-
          dotnet publish src\HelloLock.csproj -c Release -r win-x64
          --self-contained false -warnaserror
          -p:PublishSingleFile=false -p:PublishTrimmed=false
          -p:PublishReadyToRun=false -o artifacts\framework-dependent
      - name: Publish self-contained
        run: >-
          dotnet publish src\HelloLock.csproj -c Release -r win-x64
          --self-contained true -warnaserror
          -p:PublishSingleFile=false -p:PublishTrimmed=false
          -p:PublishReadyToRun=false -o artifacts\self-contained
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $errors = @()
          $paths = Get-ChildItem scripts, tests -Recurse -Filter *.ps1
          foreach ($path in $paths) {
            $fileErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $path.FullName, [ref]$null, [ref]$fileErrors)
            if ($fileErrors) { $errors += $fileErrors }
          }
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
      - name: Test install helpers
        shell: pwsh
        run: tests\install-helpers.ps1
