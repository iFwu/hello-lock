name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - mode: framework-dependent
            selfContained: "false"
          - mode: self-contained
            selfContained: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish
        shell: pwsh
        run: |
          $output = "package\${{ matrix.mode }}\publish"
          dotnet publish src\HelloLock.csproj -c Release -r win-x64 `
            --self-contained ${{ matrix.selfContained }} `
            -p:PublishSingleFile=false -p:PublishTrimmed=false `
            -p:PublishReadyToRun=false -p:DebugType=None `
            -p:DebugSymbols=false -warnaserror -o $output
      - name: Assemble and hash
        shell: pwsh
        run: |
          $root = "package\${{ matrix.mode }}"
          Copy-Item LICENSE, README.md, README.zh-CN.md, SECURITY.md -Destination $root
          Copy-Item scripts -Destination $root -Recurse
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $name = "hello-lock-${{ github.ref_name }}-win-x64-${{ matrix.mode }}.zip"
          Compress-Archive -Path "$root\*" -DestinationPath "dist\$name"
          $hash = (Get-FileHash "dist\$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content "dist\$name.sha256" -Encoding ascii
          $bytes = (Get-Item "dist\$name").Length
          "`${{ matrix.mode }}` zip: $bytes bytes" >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.mode }}
          path: dist/*
          retention-days: 1

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
